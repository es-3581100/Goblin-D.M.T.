name: Deploy Dynamic Manual

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/render-readme.mjs"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goblin-dmt-pages
  cancel-in-progress: true

jobs:
  build:
    name: Render README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bind render timestamp to source commit
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Render dynamic manual
        env:
          DMT_REPOSITORY: ${{ github.repository }}
        run: npm run docs:build

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s site/index.html
          test -s site/assets/goblin-dmt-banner.png
          grep -Fq "GOBLIN_DMT_LIVE_E2E" site/index.html
          grep -Fq "README SHA-256" site/index.html
          echo "PASS  Pages artifact verified"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
